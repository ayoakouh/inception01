services:
  mariadb:
    image: inception-mariadb
    container_name: mariadb
    build: ./requirements/mariadb
    restart: on-failure
    networks:
      - my_net
    env_file:
      - .env
    secrets:
      - databasepassword
      - my_sql_rootpassword
      - mysql_user
  
  wordpress:
    image: inception-wordpress
    container_name: wordpress
    build: ./requirements/wordpress
    restart: on-failure
    networks:
      - my_net
    env_file:
      - .env
    secrets:
      - databasepassword
      - wp_admin_password
      - wp_user_password
  
  nginx:
    image: inception-nginx
    container_name: nginx
    build: ./requirements/nginx
    restart: on-failure
    networks:
      - my_net
    env_file:
      - .env
    ports:
      - "443:443"
    # secrets:
    #   - databasepassword
    #   - wp_admin_password
    #   - wp_user_password

networks:
  my_net:
    driver: bridge


secrets:
  databasepassword:
    file: ../secrets/databasepassword
  my_sql_rootpassword:
    file: ../secrets/my_sql_rootpassword
  mysql_user:
    file: ../secrets/mysql_user

  wp_admin_password:
    file: ../secrets/wp_admin_password
  wp_user_password:
    file: ../secrets/wp_user_password
  